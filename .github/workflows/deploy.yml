name: Deploy Cleaning Flash

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: cleaning-flash
          VITE_FIREBASE_AUTH_DOMAIN: cleaning-flash.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: cleaning-flash.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "438258239671"
          VITE_FIREBASE_APP_ID: "1:438258239671:web:cleaning-flash"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cleaning-flash
          channelId: live
